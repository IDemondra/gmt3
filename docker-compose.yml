networks:
  webapp:
  traefik_preprod:
    external: true

services:
  # ── Back-end (Bun) ──
  gmt3_backend:
    image: ${DOCKER_HOST_REGISTRY_NAS}/gmt3-back:latest
    container_name: gmt3_backend
    volumes:
      - ./gmt3_back/data:/app/data
      - ./gmt3_back/uploads:/app/uploads
    environment:
      - PORT=3000
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS}
    labels:
      # Route /api (host public) -> backend. Priorité > router front.
      - traefik.enable=true
      - traefik.http.routers.gmt3-api.rule=Host(`gmt3-fianarantsoa.mg`) && (PathPrefix(`/api`) || PathPrefix(`/uploads`))
      - traefik.http.routers.gmt3-api.entrypoints=websecure
      - traefik.http.routers.gmt3-api.tls.certresolver=myresolver
      - traefik.http.routers.gmt3-api.priority=100
      # Uploads photos : le backend accepte jusqu'à 40 Mo de galerie (5 Mo/fichier).
      # Le défaut Traefik est sans limite de corps ; on pose un garde-fou 50 Mo au niveau proxy
      # pour que les envois ~10 Mo ne soient plus coupés avant d'atteindre l'app.
      - traefik.http.routers.gmt3-api.middlewares=gmt3-upload-limit
      - traefik.http.middlewares.gmt3-upload-limit.buffering.maxRequestBodyBytes=52428800
      - traefik.http.middlewares.gmt3-upload-limit.buffering.memRequestBodyBytes=26214400
      - traefik.http.services.gmt3-api.loadbalancer.server.port=3000
      - traefik.docker.network=traefik_preprod
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - webapp
      - traefik_preprod
    restart: unless-stopped

  # ── Front-end (Astro SSR — serveur Bun/Node) ──
  gmt3_frontend:
    image: ${DOCKER_HOST_REGISTRY_NAS}/gmt3-front:latest
    container_name: gmt3_frontend
    depends_on:
      gmt3_backend:
        condition: service_healthy
    environment:
      - HOST=0.0.0.0
      - PORT=4321
      # Fetch SSR (dans les .astro) -> backend interne via le réseau docker
      - API_BASE_INTERNAL=http://gmt3_backend:3000/api
    labels:
      - traefik.enable=true
      - traefik.http.routers.gmt3.rule=Host(`gmt3-fianarantsoa.mg`) || Host(`www.gmt3-fianarantsoa.mg`)
      - traefik.http.routers.gmt3.entrypoints=websecure
      - traefik.http.routers.gmt3.tls.certresolver=myresolver
      - traefik.http.routers.gmt3.priority=1
      - traefik.http.services.gmt3.loadbalancer.server.port=4321
      # Redirection 301 www -> non-www (canonical SEO)
      - traefik.http.routers.gmt3.middlewares=gmt3-www-redirect
      - traefik.http.middlewares.gmt3-www-redirect.redirectregex.regex=^https?://www\.gmt3-fianarantsoa\.mg/(.*)
      - traefik.http.middlewares.gmt3-www-redirect.redirectregex.replacement=https://gmt3-fianarantsoa.mg/$${1}
      - traefik.http.middlewares.gmt3-www-redirect.redirectregex.permanent=true
      - traefik.docker.network=traefik_preprod
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:4321/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - webapp
      - traefik_preprod
    restart: unless-stopped
