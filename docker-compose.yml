networks:
  webapp:
  traefik_preprod:
    external: true

services:
  # ── Back-end (Bun) ──
  gmt3_backend:
    image: ${DOCKER_HOST_REGISTRY_NAS}/gmt3-back:latest
    container_name: gmt3_backend
    volumes:
      - ./gmt3_back/data:/app/data
      - ./gmt3_back/uploads:/app/uploads
    environment:
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS}
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - webapp
    restart: unless-stopped

  # ── Front-end (Nginx serving SPA + Proxy to Back-end) ──
  gmt3_frontend:
    image: ${DOCKER_HOST_REGISTRY_NAS}/gmt3-front:latest
    container_name: gmt3_frontend
    depends_on:
      gmt3_backend:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.gmt3.rule=Host(`gmt3-fianarantsoa.mg`)
      - traefik.http.routers.gmt3.entrypoints=websecure
      - traefik.http.routers.gmt3.tls.certresolver=myresolver
      - traefik.http.services.gmt3.loadbalancer.server.port=80
      - traefik.docker.network=traefik_preprod
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - webapp
      - traefik_preprod
    restart: unless-stopped
