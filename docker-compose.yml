services:
  # ── Reverse Proxy (Nginx) ──
  gmt3_nginx:
    image: nginx:alpine
    ports:
      - "5173:5173"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gmt3_backend
      - gmt3_frontend

  # ── Back-end (Bun) ──
  gmt3_backend:
    build:
      context: ./gmt3_back
      dockerfile: Dockerfile
    container_name: gmt3_backend
    volumes:
      - ./gmt3_back:/app
      - /app/node_modules
      - ./gmt3_back/data:/app/data
      - ./gmt3_back/uploads:/app/uploads
    environment:
      - PORT=3000
    restart: unless-stopped

  # ── Front-end (Bun + Vite) ──
  gmt3_frontend:
    depends_on:
      - gmt3_backend
    build:
      context: ./gmt3_front
      dockerfile: Dockerfile
    container_name: gmt3_frontend
    volumes:
      - ./gmt3_front:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_BASE=/api
    restart: unless-stopped
