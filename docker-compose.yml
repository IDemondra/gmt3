services:
  # ── Back-end (Bun) ──
  backend:
    build:
      context: ./gmt3_back
      dockerfile: Dockerfile
    container_name: gmt3_backend
    ports:
      - "3000:3000"
    volumes:
      - ./gmt3_back:/app
      - /app/node_modules
      - ./gmt3_back/data:/app/data
    environment:
      - PORT=3000
    restart: unless-stopped

  # ── Front-end (Bun + Vite) ──
  frontend:
    depends_on:
      - backend
    build:
      context: ./gmt3_front
      dockerfile: Dockerfile
    container_name: gmt3_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./gmt3_front:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_BASE=http://backend:3000
    restart: unless-stopped
