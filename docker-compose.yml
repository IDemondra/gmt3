networks:
  webapp:
  traefik_preprod:
    external: true

services:
  # ── Reverse Proxy (Nginx) ──
  gmt3_nginx:
    image: nginx:alpine
    container_name: gmt3_nginx
    depends_on:
      gmt3_frontend:
        condition: service_healthy
      gmt3_backend:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.gmt3.rule=Host(`gmt3-fianarantsoa.mg`)
      - traefik.http.routers.gmt3.entrypoints=websecure
      - traefik.http.routers.gmt3.tls.certresolver=myresolver
      - traefik.http.services.gmt3.loadbalancer.server.port=80
      - traefik.docker.network=traefik_preprod
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - webapp
      - traefik_preprod

  # ── Back-end (Bun) ──
  gmt3_backend:
    build:
      context: ./gmt3_back
      dockerfile: Dockerfile
    container_name: gmt3_backend
    volumes:
      # Persistance uniquement — le code vient de l'image buildée
      - ./gmt3_back/data:/app/data
      - ./gmt3_back/uploads:/app/uploads
    environment:
      - PORT=3000
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - webapp
    restart: unless-stopped

  # ── Front-end (Bun + Vite + Nginx) ──
  gmt3_frontend:
    depends_on:
      gmt3_backend:
        condition: service_healthy
    build:
      context: ./gmt3_front
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: /api
    container_name: gmt3_frontend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - webapp
    restart: unless-stopped
