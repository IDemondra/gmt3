networks:
  webapp:
  traefik_preprod:
    external: true

services:
  # ── Reverse Proxy (Nginx) ──
  gmt3_nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gmt3_frontend
      - gmt3_backend
    labels:
      - traefik.enable=true
      - traefik.http.routers.gmt3.rule=Host(`gmt3-fianarantsoa.mg`)
      - traefik.http.routers.gmt3.entrypoints=websecure
      - traefik.http.routers.gmt3.tls.certresolver=myresolver
      - traefik.http.services.gmt3.loadbalancer.server.port=80
      - traefik.docker.network=traefik_preprod
    networks:
      - webapp
      - traefik_preprod

  # ── Back-end (Bun) ──
  gmt3_backend:
    build:
      context: ./gmt3_back
      dockerfile: Dockerfile
    container_name: gmt3_backend
    volumes:
      - ./gmt3_back:/app
      - /app/node_modules
      - ./gmt3_back/data:/app/data
      - ./gmt3_back/uploads:/app/uploads
    environment:
      - PORT=3000
    networks:
      - webapp
    restart: unless-stopped

  # ── Front-end (Bun + Vite + Nginx) ──
  gmt3_frontend:
    depends_on:
      - gmt3_backend
    build:
      context: ./gmt3_front
      dockerfile: Dockerfile
    container_name: gmt3_frontend
    networks:
      - webapp
    restart: unless-stopped
