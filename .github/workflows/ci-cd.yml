name: GMT+3 CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation-backend:
    name: Validation backend Bun
    runs-on: ubuntu-latest
    steps:
      - name: Recuperation du code source
        uses: actions/checkout@v4

      - name: Configuration de Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Installation des dépendances backend
        working-directory: gmt3_back
        run: bun install --frozen-lockfile

      - name: Vérification TypeScript
        working-directory: gmt3_back
        run: bun run check

      - name: Tests backend
        working-directory: gmt3_back
        run: bun test

  validation-frontend:
    name: Validation frontend Preact
    runs-on: ubuntu-latest
    steps:
      - name: Recuperation du code source
        uses: actions/checkout@v4

      - name: Configuration de Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Installation des dépendances frontend
        working-directory: gmt3_front
        run: bun install --frozen-lockfile

      - name: Vérification Astro
        working-directory: gmt3_front
        run: bun run check

      - name: Lint frontend
        working-directory: gmt3_front
        run: bun run lint

      - name: Tests frontend
        working-directory: gmt3_front
        run: bun test

      - name: Analyse frontend
        working-directory: gmt3_front
        run: bun x react-doctor@latest --verbose --no-color

      - name: Build frontend
        working-directory: gmt3_front
        run: bun run build

  construction-images:
    name: Construction et envoi des images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validation-backend, validation-frontend]
    runs-on: ubuntu-latest
    environment: production
    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}
    strategy:
      matrix:
        include:
          - service: gmt3-back
            context: gmt3_back
          - service: gmt3-front
            context: gmt3_front

    steps:
      - name: Recuperation du code source
        uses: actions/checkout@v4

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion au registre Docker prive
        run: |
          echo ${{ secrets.DOCKER_KEY_REGISTRY_NAS }} | docker login \
            https://${{ secrets.DOCKER_HOST_REGISTRY_NAS }} \
            --username ${{ secrets.DOCKER_USER_REGISTRY }} \
            --password-stdin

      - name: Extraction du SHA court
        id: vars
        run: echo "sha_short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Construction et push de ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HOST_REGISTRY_NAS }}/${{ matrix.service }}:${{ steps.vars.outputs.sha_short }}
            ${{ secrets.DOCKER_HOST_REGISTRY_NAS }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  deploiement:
    name: Deploiement sur le serveur
    needs: construction-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Recuperation du code source
        uses: actions/checkout@v4

      - name: Copier docker-compose.yml sur le serveur
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.NAS_HOST }}
          username: ${{ secrets.NAS_USER }}
          password: ${{ secrets.NAS_PRIVACY_KEY }}
          source: "docker-compose.yml"
          target: "gmt_3"

      - name: Deploiement
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.NAS_HOST }}
          username: ${{ secrets.NAS_USER }}
          password: ${{ secrets.NAS_PRIVACY_KEY }}
          envs: DOCKER_HOST_REGISTRY_NAS
          script: |
            set -e
            echo "=== DEMARRAGE DU DEPLOIEMENT GMT+3 ==="

            cd gmt_3
            export DOCKER_HOST_REGISTRY_NAS=${{ secrets.DOCKER_HOST_REGISTRY_NAS }}

            echo "Recuperation des nouvelles images..."
            docker compose pull

            echo "Redemarrage des conteneurs..."
            docker compose down --remove-orphans
            docker compose up -d --wait

            echo "Verification des conteneurs..."
            FAILED=0
            for service in gmt3_backend gmt3_frontend; do
              STATUS=$(docker inspect --format='{{.State.Status}}' $service 2>/dev/null || echo "missing")
              if [ "$STATUS" != "running" ]; then
                echo "ERREUR: $service est en etat '$STATUS'"
                docker logs $service --tail 20 2>&1 || true
                FAILED=1
              else
                echo "OK: $service est running"
              fi
            done

            if [ "$FAILED" = "1" ]; then
              echo "=== ROLLBACK ==="
              docker compose down --remove-orphans
              exit 1
            fi

            docker image prune -f
            echo "=== DEPLOIEMENT GMT+3 TERMINE AVEC SUCCES ==="
