events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;

        # Frontend (Static files from Nginx)
        location / {
            proxy_pass http://gmt3_frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Google CDN proxy (background images)
        location /google-img/ {
            proxy_pass https://lh3.googleusercontent.com/;
            proxy_ssl_server_name on;
            proxy_set_header Host lh3.googleusercontent.com;
            proxy_set_header Referer "https://lh3.googleusercontent.com/";
            proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36";
            proxy_cache_valid 200 7d;
            add_header Cache-Control "public, max-age=604800";
        }

        # Backend API
        location /api/ {
            proxy_pass http://gmt3_backend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Backend uploads (images)
        location /uploads/ {
            proxy_pass http://gmt3_backend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
